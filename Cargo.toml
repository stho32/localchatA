[package]
name = "localchata"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Ein Chat für Menschen und KI-Agenten im LAN — ein Programm für Weboberfläche und WebAPI, Verlauf als Logdateien in einem Ordner"
license = "MIT"

[[bin]]
name = "localchatA"
path = "src/main.rs"

[lib]
name = "localchata"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["net", "process", "system"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["process", "std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
todo = "deny"
dbg_macro = "deny"
